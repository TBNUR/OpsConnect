<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Operasional Connect</title>
      <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/TBNUR/SaveImageTR/refs/heads/main/Logo%20Image.png">
    
    <style>
        /* Reset margin dan padding bawaan browser */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            /* overflow:hidden mencegah munculnya scrollbar di samping halaman utama */
            overflow: hidden; 
            background-color: #f5f5f5;
        }

        /* Styling iframe agar membentang 100% menutupi layar tanpa border */
        .full-screen-iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>

    <!-- 
      PENTING: Atribut 'sandbox' digunakan di bawah ini TANPA 'allow-top-navigation'.
      Ini yang akan mengunci iframe sehingga tidak bisa melakukan redirect ke halaman Google.
    -->
    <iframe 
        class="full-screen-iframe" 
        src="https://script.google.com/macros/s/AKfycbxEYhZCWMtbRJiVuXFyaJl_Tb6USagp-K-pIjuKT2Jzsi4F0fhkV8S5c-vqGFMtgyPs/exec" 
        sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-downloads"
        allow="camera; microphone; clipboard-write"
        allowfullscreen="true">
    </iframe>

</body>
</html>
